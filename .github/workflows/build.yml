name: 1 - Descompactar para Edição

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar repositório
        uses: actions/checkout@v4

      - name: Extrair ZIP
        run: unzip estudos.zip

      - name: Salvar pastas no repositório
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git rm estudos.zip
          git add .
          git commit -m "Arquivos descompactados para edição"
          git push
